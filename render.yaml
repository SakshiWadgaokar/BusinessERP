# Render Blueprint for permanent 24/7 production deployment
# Push this repo to GitHub and connect via Render -> Blueprints.
services:
  - type: web
    name: business-erp-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: API_PREFIX
        value: api/v1
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: s3
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: STORAGE_SIGNED_URL_SECRET
        generateValue: true
      - key: S3_REGION
        value: ap-south-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: business-erp-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: business-erp-api
          property: hostport
